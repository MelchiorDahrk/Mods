# Requires Static Switching System instance rules and H3lp Yours3lf.
# Keep this filename stable: SSS uses the module path for saved once tracking.
# Exact IDs leave custom TR quest creatures and summoned variants unchanged.
# T_Dae_Cre_SpiderDae_02 is deliberately omitted: TR quests require its soul.
# The loose meshes cover these exceptions and creatures before SSS processes them.
log_name: "Arachnophobia Patch - Tamriel_Data"
